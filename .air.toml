# Live reload config for GAPI

root = "."
tmp_dir = "tmp"

[build]
# cmd = "go build -tags dev -o tmp/gapid ./cmd/gapid && go build -tags dev -o tmp/gapictl ./cmd/gapictl && chmod +x tmp/gapictl"
cmd = "./build/scripts/devbuild.sh"
bin = "tmp/gapid"
include_ext = ["go"]
exclude_dir = ["proto", "docs", "test", "build"]
exclude_file = ["mage_output_file.go"]
full_bin = "true"
delay = 1000
stop_on_error = true
log = "air.log"

[log]
time = true

[color]
main = "yellow"
watcher = "cyan"
build = "green"
runner = "magenta"

[misc]
clean_on_exit = false
