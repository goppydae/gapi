syntax = "proto3";

package gapi.v1.proto;

option go_package = "github.com/goppydae/gapi/internal/proto;gapiv1";

import "google/protobuf/any.proto";

message Envelope {
  string id = 1;
  string type = 2;
  string topic = 3;
  string source = 4;
  string namespace = 5;
  google.protobuf.Any payload = 6;
  repeated string tags = 7;
}
