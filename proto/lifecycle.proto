syntax = "proto3";

package proto;
option go_package = "github.com/goppydae/gapi/internal/proto/v1;proto";

message LifecycleControl {
  string agent_name = 1;

  enum Action {
    START = 0;
    STOP = 1;
    RESTART = 2;
  }

  Action action = 2;
}

message LifecycleStatus {
  string agent_name = 1;
  string status = 2;   // e.g., "started", "not_found"
  int64 pid = 3;
  string message = 4;
}
