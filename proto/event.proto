syntax = "proto3";

package proto;
option go_package = "github.com/goppydae/gapi/internal/proto/v1;proto";

import "google/protobuf/any.proto";

// Envelope for all structured events.
// This is the top-level type passed through logs, IPC, or audit systems.
message Event {
  string id = 1;
  string type = 2;          // e.g., "lifecycle", "eventbus", "status"
  string source = 3;        // e.g., "goblin.agent"
  google.protobuf.Any payload = 4; // Event-specific payload (see below)
}

// Payload for lifecycle transitions.
message LifecycleEvent {
  string action = 1;     // e.g., "start", "stop", "restart"
  string agent_id = 2;
  string version = 3;
}

// Payload for internal event bus messages.
message BusEvent {
  string topic = 1;
  string payload = 2;
}
