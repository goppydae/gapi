syntax = "proto3";

package gapi.v1.proto;

option go_package = "github.com/goppydae/gapi/pkg/proto;gapiv1";

message LifecycleControl {
  string agent_id = 1;

  // Enum for supported lifecycle actions
  Action action = 2;

  // Environment variables for the agent (only used for START/RESTART)
  map<string, string> env = 3;

  // Restart policy (e.g. "always", "on-failure", "never")
  string restart_policy = 4;

  enum Action {
    ACTION_UNSPECIFIED = 0;
    INITIALIZE = 1;
    START = 2;
    STOP = 3;
    RESTART = 4;
    RELOAD = 5;
  }
}
