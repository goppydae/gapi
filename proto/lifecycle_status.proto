syntax = "proto3";

package gapi.v1.proto;

option go_package = "github.com/goppydae/gapi/internal/proto;gapiv1";

import "google/protobuf/timestamp.proto";

message LifecycleStatus {
  string agent_id = 1;
  string state = 2;
  string message = 3;
  google.protobuf.Timestamp time = 4;
  string hostname = 5;
  string schema_hash = 6;
}
