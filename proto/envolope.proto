syntax = "proto3";

package proto;
option go_package = "github.com/goppydae/gapi/internal/proto/v1;proto";

message Envelope {
  string id = 1;
  string type = 2;
  string topic = 3;
  string source = 4;
  map<string, string> payload = 5;
}

service GoblinStream {
  rpc Communicate(stream Envelope) returns (stream Envelope);
}
