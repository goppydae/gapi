syntax = "proto3";

package proto;

option go_package = "github.com/goppydae/gapi/internal/proto/v1;proto";

enum AgentState {
  AGENT_STATE_UNKNOWN = 0;
  AGENT_STATE_INITIALIZING = 1;
  AGENT_STATE_INITIALIZED = 2;
  AGENT_STATE_STARTING = 3;
  AGENT_STATE_STARTED = 4;
  AGENT_STATE_RUNNING = 5;
  AGENT_STATE_STOPPING = 6;
  AGENT_STATE_STOPPED = 7;
  AGENT_STATE_FAILED = 8;
  AGENT_STATE_RELOADING = 9;
}

message AgentStatus {
  string id        = 1;
  string type      = 2;
  AgentState state = 3;
  string name      = 4;
  string language  = 5;
  string version   = 6;
  repeated string capabilities = 7;
  repeated string dependencies = 8;
}

message AgentStatusRequest {} // usually empty or may filter by id/prefix
message AgentStatusResponse { repeated AgentStatus agents = 1; }

service Supervisor {
  rpc ListAgents(AgentStatusRequest) returns (AgentStatusResponse);
}
