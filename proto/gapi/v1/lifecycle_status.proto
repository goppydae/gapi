syntax = "proto3";

package gapi.v1;

option go_package = "github.com/goppydae/gapi/pkg/proto;gapiv1";

import "google/protobuf/timestamp.proto";

message LifecycleStatus {
  string agent_id = 1;
  string state = 2;
  string message = 3;
  google.protobuf.Timestamp time = 4;
  string hostname = 5;
  string schema_hash = 6;
  // run_id identifies a specific run/incarnation of the agent process so restart
  // detection can match structurally instead of parsing it out of `message`.
  string run_id = 7;
}
