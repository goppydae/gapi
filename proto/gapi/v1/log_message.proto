syntax = "proto3";

package gapi.v1;

option go_package = "github.com/goppydae/gapi/pkg/proto;gapiv1";

message LogMessage {
  string agent_id = 1;
  string level = 2;      // DEBUG, INFO, WARN, ERROR
  string message = 3;
  int64 timestamp = 4;   // Unix timestamp in milliseconds
}
