syntax = "proto3";

package gapi.v1.proto;

option go_package = "github.com/goppydae/gapi/internal/proto;gapiv1";

import "google/protobuf/timestamp.proto";

message LifecycleTransition {
  string agent_id = 1;
  string from = 2;
  string to = 3;
  string hostname = 4;
  google.protobuf.Timestamp time = 5;
}