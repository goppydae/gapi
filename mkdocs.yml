site_name: GAPI
site_description: GoPPydae Agent Process Infrastructure
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: purple
    - scheme: slate
      primary: teal
      accent: purple

nav:
  - Home: index.md
  - Starting:
    - Getting Started: getting-started.md
    - Installation: installation.md
    - Configuration: configuration.md
    - Configuration Examples: config-example.md
  - Design:
    - Architecture: gapi-design-document.md
    - Features: features.md
    - Library Usage: library_usage.md
    - Protobuf Compatibility: protobuf_compatibility.md
  - Operations:
    - PID 1: pid1-testing.md
  - Development:
    - Developer Guide: development.md
    - Agent Examples: agent-examples.md
    - Cursed Knowledge: cursed-knowledge.md
    - Determinism Checklist: determinism_checklist.md
  - Reference:
    - Glossary: glossary.md
    - Lexicon: lexicon.md
    - Lore: lore.md
    - History: history.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
