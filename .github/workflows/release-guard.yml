name: Release Guard

# The only reader of the VERSION file's agreement with the tag.
#
# VERSION is documented in magelib's version.go as "the single source of
# version truth in the repo" and normatively in the build-environment
# design as "kept in agreement with the changelog and the git tag", and
# nothing read it for that purpose. It went stale three times in four
# days across the silo - the third time hours after MAGELIB-DIV-006 was
# filed, which is why this is a gate rather than another procedure.
#
# Tags only, and a separate workflow from ci.yml on purpose. This must
# not spend gapi's full critical path to compare one string, and must
# not add a context to the branch ruleset's required set - a tag-ref job
# has no pull request to block.
#
# It runs AFTER the tag is pushed, so it detects rather than prevents.
# Prevention is the same code path run locally before tagging:
#
#   GITHUB_REF_TYPE=tag GITHUB_REF_NAME=vX.Y.Z nix develop -c mage checkVersion
#
# A tag with NO run here is not a pass - it means the trigger never
# matched, which looks exactly like nothing being wrong.

on:
  push:
    tags: ['v*']

jobs:
  version-matches-tag:
    name: VERSION matches tag
    runs-on: ubuntu-latest
    env:
      # CI has no sibling checkouts for the committed go.work to
      # resolve; vendored builds are the lone-clone contract.
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Synchronize Environment (Nix)
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # No pipe. A piped command reports the pipeline's exit status, not
      # the command's, which is how a gate reports success for its entire
      # existence without ever having run.
      - name: Check VERSION against tag
        run: nix develop -c mage -v checkVersion
