name: gapi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler python3 python3-dev gcc

      - name: Install Go tools
        run: |
          go install github.com/magefile/mage@latest
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate protobuf code
        run: |
          # Generate protobuf files if they don't exist
          if [ -f "Magefile.go" ] && mage -l | grep -q "proto"; then
            echo "Generating protobuf code via Mage..."
            mage proto || echo "Proto generation via mage failed, continuing..."
          fi

      - name: Tidy Go modules
        run: go mod tidy

      - name: Verify go.mod is clean
        run: |
          git diff --exit-code go.mod go.sum || \
          (echo "go.mod or go.sum is not up to date. Please run 'go mod tidy' locally and commit the changes." && exit 1)

      - name: Build all targets
        run: mage buildAll

      - name: Run tests
        run: |
          echo "Running tests..."
          if find . -name '*_test.go' | grep -q .; then
            go test -v ./...
          else
            echo "No test files found, skipping tests"
          fi

      - name: Check formatting
        run: |
          if ! gofmt -l . | grep -q .; then
            echo "Code is properly formatted"
          else
            echo "The following files are not properly formatted:"
            gofmt -l .
            exit 1
          fi

