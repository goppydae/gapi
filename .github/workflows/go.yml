name: gapi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Verify module cache
        run: go mod tidy

      - name: Build daemons and tools
        run: |
          go build ./cmd/gapid
          go build ./cmd/gapictl
          go build ./...

      - name: Run tests
        run: go test ./... -v

      - name: Upload coverage (optional)
        if: success()
        run: go test -coverprofile=coverage.out ./...

      # Add your own steps for bindings or DDK builds here
