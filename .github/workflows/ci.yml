name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      

      
      - name: Build
        run: nix develop -c mage build
      
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            bin/gapictl
            bin/gapid
          retention-days: 7

      - name: Trigger Goblin CI
        if: success() && github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.CI_PAT }}
          repository: goppydae/goblin
          event-type: gapi-build-success

  test-cross-adk:
    name: Cross-ADK Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      

      
      - name: Run Cross-ADK Tests
        run: |
          nix develop -c go test -v ./test/adk/ -run TestCrossADKParity 2>&1 | tee /tmp/cross-adk-test.log
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: /tmp/cross-adk-test*.log
          retention-days: 30
