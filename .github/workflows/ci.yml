name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  full-build-and-test:
    name: Full Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workspace
        uses: actions/checkout@v4
      
      - name: Synchronize Environment (Nix)
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      

      
      - name: Compile System Binaries
        run: nix develop -c mage build
      
      - name: Execute System Tests
        run: nix develop -c go test -v ./...
      
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            bin/gapictl
            bin/gapid
          retention-days: 7

      - name: Trigger Goblin CI
        if: success() && github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.CI_PAT }}
          repository: goppydae/goblin
          event-type: gapi-build-success

  execute-cross-adk-tests:
    name: Execute Cross-ADK Tests
    runs-on: ubuntu-latest
    needs: full-build-and-test
    steps:
      - name: Checkout Workspace
        uses: actions/checkout@v4
      
      - name: Synchronize Environment (Nix)
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      

      
      - name: Execute Cross-ADK Tests
        run: |
          nix develop -c go test -v ./test/adk/ -run TestCrossADKParity 2>&1 | tee /tmp/cross-adk-test.log
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: /tmp/cross-adk-test*.log
          retention-days: 30
